document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

orm: uppercase; background: #C9A26B; color: #FBF8F4; padding: 15px 26px; min-height: 44px; display: flex; align-items: center;\">Get the book<\u002Fa>\n        <span style=\"display: flex; gap: 10px;\">\n          <a href=\"https://www.instagram.com/\" target=\"_blank\" rel=\"noopener\" aria-label=\"Instagram\" style=\"width: 34px; height: 34px; border: 1px solid rgba(201,162,107,0.4); display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.06em; color: #6C7185;\">IG<\u002Fa>\n          <a href=\"https://www.linkedin.com/\" target=\"_blank\" rel=\"noopener\" aria-label=\"LinkedIn\" style=\"width: 34px; height: 34px; border: 1px solid rgba(201,162,107,0.4); display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.06em; color: #6C7185;\">IN<\u002Fa>\n        <\u002Fspan>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" data-screen-label=\"Hero\" style=\"position: relative; overflow: hidden; padding: clamp(48px, 6vw, 96px) clamp(20px, 4vw, 100px) clamp(72px, 9vw, 140px);\">\n    <div style=\"position: absolute; top: 40px; left: -60px; right: 0; bottom: 0; pointer-events: none; user-select: none; font-family: Marcellus, serif; font-size: clamp(90px, 13vw, 180px); line-height: 0.95; color: #E8DCCB; letter-spacing: 0.02em; opacity: 0.85;\">\n      <div>LOVE<\u002Fdiv>\n      <div data-vertical=\"ghost\" style=\"margin-left: 120px;\">SHADES<\u002Fdiv>\n      <div data-vertical=\"ghost\">PEOPLE<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: relative; max-width: 1240px; margin: 0 auto; display: flex; gap: clamp(32px, 5vw, 80px); align-items: flex-start; flex-wrap: wrap;\">\n      <div data-offset=\"hero-photo\" style=\"flex: 1 1 420px; margin-top: -60px;\">\n        <div style=\"width: 100%; aspect-ratio: 4 / 5; background-image: repeating-linear-gradient(135deg, #E4D8C6 0px, #E4D8C6 6px, #F4EDE3 6px, #F4EDE3 13px); display: flex; align-items: center; justify-content: center;\">\n          <span style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6C7185; background: #FBF8F4; padding: 10px 16px;\">hero portrait — 4:5<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 420px; padding-top: clamp(0px, 4vw, 64px);\">\n        <h1 style=\"margin: 0; font-family: Marcellus, serif; font-weight: 400; font-size: clamp(36px, 5.2vw, 64px); line-height: 1.1; color: #3F4459;\">Chidinma Okorie<\u002Fh1>\n        <p style=\"margin: 24px 0 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(20px, 2.2vw, 27px); line-height: 1.4; color: #6C7185; max-width: 30ch;\">Writer, researcher, and — after twenty years away from it — a student of English again.<\u002Fp>\n        <a href=\"#book\" style=\"margin-top: 40px; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; background: #C9A26B; color: #FBF8F4; padding: 18px 40px; min-height: 44px; display: inline-flex; align-items: center;\">Read the book<\u002Fa>\n      <\u002Fdiv>\n      <div data-vertical=\"hero-margin\" style=\"writing-mode: vertical-rl; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185; padding-top: 40px;\">Durham · Ibadan · Loughborough<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"premise\" data-screen-label=\"Premise\" style=\"background: #A7B3A9; padding: clamp(72px, 9vw, 120px) clamp(20px, 4vw, 100px); text-align: center;\">\n    <div style=\"max-width: 720px; margin: 0 auto;\">\n      <h2 style=\"margin: 0; font-family: Marcellus, serif; font-weight: 400; font-size: clamp(30px, 4vw, 48px); line-height: 1.15; color: #FBF8F4;\">The Many Shades of Love<\u002Fh2>\n      <p style=\"margin: 28px 0 0; font-size: clamp(16px, 1.2vw, 17px); line-height: 1.75; color: #FBF8F4; text-wrap: pretty;\">A book about the forms love takes when nobody is watching — in families, in friendships, across distance, and in the quiet decisions we make about who we choose to keep. Written for anyone who has ever loved imperfectly and kept trying anyway.<\u002Fp>\n      <a href=\"#book\" style=\"margin-top: 40px; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; border: 1px solid #FBF8F4; color: #FBF8F4; padding: 18px 40px; min-height: 44px; display: inline-flex; align-items: center;\">About the book<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"research\" data-screen-label=\"Three cards\" style=\"padding: clamp(72px, 9vw, 120px) clamp(20px, 4vw, 100px);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;\">\n      <article style=\"border: 1px solid rgba(201,162,107,0.4); padding: clamp(32px, 3.5vw, 48px); display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"width: 34px; height: 26px; border: 1px solid #3F4459; border-left-width: 3px;\"><\u002Fdiv>\n        <h3 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 2.4vw, 32px); line-height: 1.25; color: #3F4459;\">The Many Shades of Love<\u002Fh3>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\">Her first book, and a return to where she started — she took her first degree in English at the University of Ibadan before her work turned toward migration and geography.<\u002Fp>\n        <a href=\"#book\" style=\"margin-top: auto; align-self: flex-start; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; background: #9DB0BE; color: #FBF8F4; padding: 16px 32px; min-height: 44px; display: inline-flex; align-items: center;\">Read more<\u002Fa>\n      <\u002Farticle>\n      <article style=\"border: 1px solid rgba(201,162,107,0.4); padding: clamp(32px, 3.5vw, 48px); display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"width: 30px; height: 30px; border: 1px solid #3F4459; border-radius: 50%; border-top-color: transparent;\"><\u002Fdiv>\n        <h3 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 2.4vw, 32px); line-height: 1.25; color: #3F4459;\">The academic work<\u002Fh3>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\">Her research examines the relationship between migration, education and development, built around the experiences of Nigerian Commonwealth Scholars educated in the UK. She has guest-edited a special issue of <em style=\"font-family: 'Cormorant Garamond', serif; font-size: 19px;\">Globalisation, Societies and Education<\u002Fem> on the geographies of professional careers.<\u002Fp>\n        <a href=\"https://orcid.org/0000-0001-7539-3484\" target=\"_blank\" rel=\"noopener\" style=\"margin-top: auto; align-self: flex-start; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; background: #9DB0BE; color: #FBF8F4; padding: 16px 32px; min-height: 44px; display: inline-flex; align-items: center;\">See publications<\u002Fa>\n      <\u002Farticle>\n      <article style=\"border: 1px solid rgba(201,162,107,0.4); padding: clamp(32px, 3.5vw, 48px); display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"width: 34px; height: 24px; border: 1px solid #3F4459;\"><\u002Fdiv>\n        <h3 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 2.4vw, 32px); line-height: 1.25; color: #3F4459;\">Get in touch<\u002Fh3>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\">For invitations to speak, press enquiries, or anything about the book.<\u002Fp>\n        <a href=\"#contact\" style=\"margin-top: auto; align-self: flex-start; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; background: #9DB0BE; color: #FBF8F4; padding: 16px 32px; min-height: 44px; display: inline-flex; align-items: center;\">Contact<\u002Fa>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"book\" data-screen-label=\"The book\" style=\"background: #B08B84; padding: clamp(72px, 9vw, 120px) clamp(20px, 4vw, 100px);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; display: flex; gap: clamp(32px, 5vw, 80px); align-items: center; flex-wrap: wrap;\">\n      <div style=\"flex: 1 1 380px; background: #FBF8F4; padding: clamp(32px, 4vw, 64px); display: flex; justify-content: center;\">\n        <div style=\"width: 100%; max-width: 320px; aspect-ratio: 2 / 3; background-image: repeating-linear-gradient(135deg, #E4D8C6 0px, #E4D8C6 6px, #F4EDE3 6px, #F4EDE3 13px); display: flex; align-items: center; justify-content: center; text-align: center;\">\n          <span style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6C7185; background: #FBF8F4; padding: 10px 14px;\">book cover mockup<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"buy\" style=\"flex: 1 1 380px;\">\n        <p style=\"margin: 0 0 18px; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #FBF8F4;\">The book<\u002Fp>\n        <h2 style=\"margin: 0; font-family: Marcellus, serif; font-weight: 400; font-size: clamp(30px, 4vw, 48px); line-height: 1.15; color: #FBF8F4;\">The Many Shades of Love<\u002Fh2>\n        <p style=\"margin: 16px 0 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(22px, 2.2vw, 28px); color: #FBF8F4;\">Get your copy<\u002Fp>\n        <p style=\"margin: 24px 0 0; font-size: 17px; line-height: 1.75; color: #FBF8F4; max-width: 46ch; text-wrap: pretty;\">A book about the forms love takes when nobody is watching — in families, in friendships, across distance, and in the quiet decisions we make about who we choose to keep. Written for anyone who has ever loved imperfectly and kept trying anyway.<\u002Fp>\n        <div style=\"margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px;\">\n          <a href=\"#buy\" target=\"_blank\" rel=\"noopener\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; background: #C9A26B; color: #FBF8F4; padding: 18px 34px; min-height: 44px; display: inline-flex; align-items: center;\">Buy on Amazon<\u002Fa>\n          <a href=\"#buy\" target=\"_blank\" rel=\"noopener\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; border: 1px solid #FBF8F4; color: #FBF8F4; padding: 18px 34px; min-height: 44px; display: inline-flex; align-items: center;\">Waterstones<\u002Fa>\n          <a href=\"#buy\" target=\"_blank\" rel=\"noopener\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; border: 1px solid #FBF8F4; color: #FBF8F4; padding: 18px 34px; min-height: 44px; display: inline-flex; align-items: center;\">Bookshop.org<\u002Fa>\n        <\u002Fdiv>\n        <p style=\"margin: 18px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 0.06em; color: #FBF8F4; opacity: 0.85;\">retailer links — placeholder, add real URLs<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Inside the book\" style=\"padding: clamp(72px, 9vw, 120px) clamp(20px, 4vw, 100px);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;\">\n      <article style=\"border: 1px solid rgba(201,162,107,0.4); padding: clamp(32px, 3.5vw, 48px); display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 2.4vw, 32px); line-height: 1.25; color: #3F4459;\">What it is about<\u002Fh3>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\">Love in families, in friendships, across distance — and the quiet decisions we make about who we choose to keep.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"border: 1px solid rgba(201,162,107,0.4); padding: clamp(32px, 3.5vw, 48px); display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 2.4vw, 32px); line-height: 1.25; color: #3F4459;\">Why she wrote it<\u002Fh3>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\">Her first book, and a return to where she started — she took her first degree in English at the University of Ibadan before her work turned toward migration and geography.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"border: 1px solid rgba(201,162,107,0.4); padding: clamp(32px, 3.5vw, 48px); display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 2.4vw, 32px); line-height: 1.25; color: #3F4459;\">Details<\u002Fh3>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\">Publisher and publication date to be confirmed. For review copies or press enquiries, get in touch.<\u002Fp>\n        <a href=\"#contact\" style=\"margin-top: auto; align-self: flex-start; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; background: #9DB0BE; color: #FBF8F4; padding: 16px 32px; min-height: 44px; display: inline-flex; align-items: center;\">Contact<\u002Fa>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"author\" data-screen-label=\"Author\" style=\"position: relative; overflow: hidden; padding: clamp(72px, 9vw, 120px) clamp(20px, 4vw, 100px);\">\n    <div data-vertical-wide=\"author-margin\" style=\"position: absolute; top: 80px; right: 24px; writing-mode: vertical-rl; font-family: Marcellus, serif; font-size: 64px; letter-spacing: 0.1em; color: #E8DCCB;\">Obligation · Return · Ambition<\u002Fdiv>\n    <div style=\"max-width: 1240px; margin: 0 auto; padding-right: clamp(0px, (100vw - 1358px) * 100, 200px); display: flex; gap: clamp(32px, 5vw, 72px); align-items: flex-start; flex-wrap: wrap;\">\n      <div style=\"flex: 1 1 400px; position: relative;\">\n        <div data-offset=\"author-block\" style=\"position: absolute; top: -28px; left: -28px; width: 70%; height: 70%; background-image: repeating-linear-gradient(135deg, #E8DCCB 0px, #E8DCCB 10px, #EFE6D8 10px, #EFE6D8 20px);\"><\u002Fdiv>\n        <div style=\"position: relative; border: 12px solid #C9A26B;\">\n          <div style=\"width: 100%; aspect-ratio: 1 / 1; background-image: repeating-linear-gradient(135deg, #E4D8C6 0px, #E4D8C6 6px, #F4EDE3 6px, #F4EDE3 13px); display: flex; align-items: center; justify-content: center;\">\n            <span style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6C7185; background: #FBF8F4; padding: 10px 16px;\">author portrait — 1:1<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 400px; max-width: 560px;\">\n        <h2 data-offset=\"author-title\" style=\"margin: 0 0 28px -80px; background: #FBF8F4; display: inline-block; padding: 12px 24px 12px 0; font-family: Marcellus, serif; font-weight: 400; font-size: clamp(30px, 4vw, 48px); line-height: 1.15; color: #3F4459;\">About Chidinma<\u002Fh2>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\">Chidinma Okorie is a writer and researcher based in the United Kingdom, where she works as Senior Academic Development Manager at Durham University. She took her first degree in English at the University of Ibadan, then an MSc and a PhD at Loughborough, and her research has since followed Nigerian scholars educated in Britain — asking what obligation, return and ambition really mean for the people carrying them.<\u002Fp>\n        <p style=\"margin: 20px 0 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\"><em style=\"font-family: 'Cormorant Garamond', serif; font-size: 19px;\">The Many Shades of Love<\u002Fem> is her first book, and her first return to English since Ibadan.<\u002Fp>\n        <p style=\"margin: 20px 0 0; font-size: 17px; line-height: 1.75; color: #6C7185; text-wrap: pretty;\">As she puts it: over 30-odd years of walking through life, she has come to know she has a heart for people. Not loved perfectly — but to the best of her ability, and at peace with that.<\u002Fp>\n        <p style=\"margin: 32px 0 0; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185;\">PhD · AFHEA · FRGS · Durham University<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Pull quote\" style=\"background: #9DB0BE; padding: clamp(72px, 10vw, 140px) clamp(20px, 4vw, 100px); text-align: center;\">\n    <blockquote style=\"margin: 0 auto; max-width: 1000px;\">\n      <p style=\"margin: 0; font-family: Marcellus, serif; font-size: clamp(30px, 5.4vw, 68px); line-height: 1.2; color: #FBF8F4; text-wrap: pretty;\">“I remind myself that I'm beautiful, smart, confident, and can achieve anything I set my mind on.”<\u002Fp>\n      <footer style=\"margin-top: 40px; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #FBF8F4;\">— Chidinma Okorie<\u002Ffooter>\n    <\u002Fblockquote>\n  <\u002Fsection>\n\n  <section id=\"contact\" data-screen-label=\"Contact\" style=\"padding: clamp(72px, 9vw, 120px) clamp(20px, 4vw, 100px);\">\n    <div style=\"max-width: 1240px; margin: 0 auto;\">\n      <h2 style=\"margin: 0; font-family: Marcellus, serif; font-weight: 400; font-size: clamp(30px, 4.4vw, 54px); line-height: 1.12; color: #3F4459;\">Get in touch<\u002Fh2>\n      <p style=\"margin: 18px 0 clamp(48px, 5vw, 72px); max-width: 620px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(20px, 2.1vw, 26px); line-height: 1.45; color: #6C7185;\">For the book, for speaking, or just to say something the book made you think about.<\u002Fp>\n      <div style=\"display: flex; gap: clamp(40px, 6vw, 96px); flex-wrap: wrap; align-items: flex-start;\">\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"flex: 1 1 460px; display: flex; flex-direction: column; gap: 28px;\">\n          <div style=\"display: flex; gap: 20px; flex-wrap: wrap;\">\n            <div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 10px;\">\n              <label for=\"first\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185;\">First name<\u002Flabel>\n              <input id=\"first\" name=\"first\" type=\"text\" required=\"required\" style=\"min-height: 52px; border: 1px solid rgba(201,162,107,0.4); background: #FBF8F4; color: #3F4459; padding: 0 16px; font-family: Poppins, sans-serif; font-weight: 300; font-size: 16px;\">\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 10px;\">\n              <label for=\"last\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185;\">Last name<\u002Flabel>\n              <input id=\"last\" name=\"last\" type=\"text\" required=\"required\" style=\"min-height: 52px; border: 1px solid rgba(201,162,107,0.4); background: #FBF8F4; color: #3F4459; padding: 0 16px; font-family: Poppins, sans-serif; font-weight: 300; font-size: 16px;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <label for=\"cemail\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185;\">Email<\u002Flabel>\n            <input id=\"cemail\" name=\"email\" type=\"email\" required=\"required\" style=\"min-height: 52px; border: 1px solid rgba(201,162,107,0.4); background: #FBF8F4; color: #3F4459; padding: 0 16px; font-family: Poppins, sans-serif; font-weight: 300; font-size: 16px;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <label for=\"subject\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185;\">Subject<\u002Flabel>\n            <input id=\"subject\" name=\"subject\" type=\"text\" required=\"required\" style=\"min-height: 52px; border: 1px solid rgba(201,162,107,0.4); background: #FBF8F4; color: #3F4459; padding: 0 16px; font-family: Poppins, sans-serif; font-weight: 300; font-size: 16px;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <label for=\"message\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185;\">Message<\u002Flabel>\n            <textarea id=\"message\" name=\"message\" rows=\"7\" required=\"required\" style=\"border: 1px solid rgba(201,162,107,0.4); background: #FBF8F4; color: #3F4459; padding: 14px 16px; font-family: Poppins, sans-serif; font-weight: 300; font-size: 16px; line-height: 1.7; resize: vertical;\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"align-self: flex-start; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; background: #C9A26B; color: #FBF8F4; border: 0; padding: 18px 40px; min-height: 52px; cursor: pointer;\">Send message<\u002Fbutton>\n          <p style=\"margin: 0; min-height: 24px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #6C7185;\">{{ sentMessage }}<\u002Fp>\n        <\u002Fform>\n        <aside style=\"flex: 1 1 340px; max-width: 460px; border-left: 1px solid rgba(201,162,107,0.4); padding-left: clamp(24px, 3vw, 48px);\">\n          <p style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(22px, 2.2vw, 30px); line-height: 1.4; color: #3F4459;\">“Discernment about who we keep is its own kind of love.”<\u002Fp>\n          <hr style=\"margin: 40px 0; border: 0; border-top: 1px solid rgba(201,162,107,0.4);\">\n          <p style=\"margin: 0 0 10px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: #3F4459;\">For press &amp; media enquiries<\u002Fp>\n          <p style=\"margin: 0; font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185;\">Email address to confirm<\u002Fp>\n          <hr style=\"margin: 40px 0; border: 0; border-top: 1px solid rgba(201,162,107,0.4);\">\n          <p style=\"margin: 0 0 10px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: #3F4459;\">Academic work<\u002Fp>\n          <a href=\"https://orcid.org/0000-0001-7539-3484\" target=\"_blank\" rel=\"noopener\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #C9A26B;\">Full publication list on ORCID<\u002Fa>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div data-screen-label=\"Marquee\" style=\"background: #E8DCCB; overflow: hidden; padding: 22px 0;\">\n    <div data-marquee=\"1\" style=\"display: flex; width: max-content; animation: om-marquee 26s linear infinite;\">\n      <a href=\"https://www.instagram.com/\" target=\"_blank\" rel=\"noopener\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #3F4459; white-space: nowrap; padding-right: 40px;\">Follow along on Instagram @chidinmaokorie — Follow along on Instagram @chidinmaokorie — Follow along on Instagram @chidinmaokorie — <\u002Fa>\n      <a href=\"https://www.instagram.com/\" target=\"_blank\" rel=\"noopener\" aria-hidden=\"true\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #3F4459; white-space: nowrap; padding-right: 40px;\">Follow along on Instagram @chidinmaokorie — Follow along on Instagram @chidinmaokorie — Follow along on Instagram @chidinmaokorie — <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer data-screen-label=\"Footer\" style=\"padding: clamp(56px, 7vw, 96px) clamp(20px, 4vw, 100px) 56px; text-align: center;\">\n    <div style=\"display: flex; justify-content: center; gap: 14px;\">\n      <a href=\"https://www.instagram.com/\" target=\"_blank\" rel=\"noopener\" aria-label=\"Instagram\" style=\"width: 44px; height: 44px; border-radius: 50%; background: #C9A26B; color: #FBF8F4; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.06em;\">IG<\u002Fa>\n      <a href=\"https://www.linkedin.com/\" target=\"_blank\" rel=\"noopener\" aria-label=\"LinkedIn\" style=\"width: 44px; height: 44px; border-radius: 50%; background: #C9A26B; color: #FBF8F4; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.06em;\">IN<\u002Fa>\n      <a href=\"https://orcid.org/0000-0001-7539-3484\" target=\"_blank\" rel=\"noopener\" aria-label=\"ORCID\" style=\"width: 44px; height: 44px; border-radius: 50%; background: #C9A26B; color: #FBF8F4; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.06em;\">iD<\u002Fa>\n    <\u002Fdiv>\n    <nav style=\"margin-top: 40px; display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 32px;\">\n      <a href=\"#top\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 0;\">Home<\u002Fa>\n      <a href=\"#author\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 0;\">About<\u002Fa>\n      <a href=\"#book\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 0;\">The Book<\u002Fa>\n      <a href=\"https://orcid.org/0000-0001-7539-3484\" target=\"_blank\" rel=\"noopener\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 0;\">Publications<\u002Fa>\n      <a href=\"#contact\" style=\"font-family: Poppins, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 0;\">Contact<\u002Fa>\n    <\u002Fnav>\n    <p style=\"margin: 32px 0 0; font-family: Poppins, sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #6C7185;\">© 2026 Chidinma Okorie<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { sentMessage: \"\" };\n  renderVals() {\n    return {\n      sentMessage: this.state.sentMessage,\n      onSubmit: (e) => {\n        e.preventDefault();\n        this.setState({ sentMessage: \"Thank you — your message has been sent.\" });\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
